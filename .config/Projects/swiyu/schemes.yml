#####
##### Variables
#####

define: &launch_arguments
  -disable-device-pin: false
  -disable-secure-enclave: false
  -disable-user-inactivity-timeout: false
  -disable-delays: false
  -disable-onboarding: false
  -disable-lock-wallet: false

define: &targets
  targets:
    swiyu: all

define: &parallel_test_target
  parallelizable: false

define: &unit_test_plans
  testPlans:
    - path: "../../../swiyuTests/swiyu Dev.xctestplan"

#####
##### Schemes
#####

schemes:
  swiyu Dev:
    build:
      <<: *targets
    run:
      config: Dev (debug)
      commandLineArguments: 
        <<: *launch_arguments
        -disable-user-inactivity-timeout: true
    test:
      config: Dev (debug)
      <<: *unit_test_plans
    profile:
      config: Dev (release)
    analyze:
      config: Dev (debug)
    archive:
      config: Dev (release)
      customArchiveName: swiyu-Dev
      revealArchiveInOrganizer: true

  swiyu Ref:
    build:
      <<: *targets
    run:
      config: Ref (debug)
      commandLineArguments: 
        <<: *launch_arguments
    test:
      config: Ref (debug)
      <<: *unit_test_plans
    profile:
      config: Ref (release)
    analyze:
      config: Ref (debug)
    archive:
      config: Ref (release)
      customArchiveName: swiyu-Ref
      revealArchiveInOrganizer: true

  swiyu Abn:
    build:
      <<: *targets
    run:
      config: Abn (debug)
      commandLineArguments: 
        <<: *launch_arguments
    test:
      config: Abn (debug)
      <<: *unit_test_plans
    profile:
      config: Abn (release)
    analyze:
      config: Abn (debug)
    archive:
      config: Abn (release)
      customArchiveName: swiyu-Abn
      revealArchiveInOrganizer: true

  swiyu Abn Store:
    build:
      <<: *targets
    run:
      config: Abn Store (debug)
      commandLineArguments: 
        <<: *launch_arguments
    test:
      config: Abn Store (debug)
      <<: *unit_test_plans
    profile:
      config: Abn Store (release)
    analyze:
      config: Abn Store (debug)
    archive:
      config: Abn Store (release)
      customArchiveName: swiyu-Abn-Store
      revealArchiveInOrganizer: true

  swiyu Prod:
    build:
      <<: *targets
    run:
      config: Prod (debug)
      commandLineArguments: 
        <<: *launch_arguments
    test:
      config: Prod (debug)
      <<: *unit_test_plans
    profile:
      config: Prod (release)
    analyze:
      config: Prod (debug)
    archive:
      config: Prod (release)
      customArchiveName: swiyu-Prod
      revealArchiveInOrganizer: true

  swiyu-debugger:
    build:
      targets:
        swiyu-debugger: all
    run:
      config: Dev (debug)
      commandLineArguments: 
        <<: *launch_arguments
    archive:
      config: Dev (release)
      customArchiveName: swiyu-debugger-Dev
      revealArchiveInOrganizer: true
