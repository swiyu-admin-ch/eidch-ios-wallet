    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: ../../../swiyuTests
    dependencies:
      - target: swiyu
    settings:
      base:
        DEVELOPMENT_TEAM: 2NG6YF3PM2
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/swiyu.app/swiyu
