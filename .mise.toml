[env]
_.file = '.env'

[tools]
xcodegen = '2.44.1'
swiftlint = '0.63.2'
swiftformat = "0.59.1"
swift-package-list = "4.10.0"
swiftgen = '6.6.3'
danger-swift = '3.22.0'
ruby = '3.4.7'
'gem:bundler' = '2.7'
snyk = '1.1304.1'

# ── Project ──────────────────────────────────────────────────────────

[tasks."project:generate"]
description = 'Build xcode project'
depends = ['project:build']
run = ['open swiyu.xcodeproj']

[tasks."project:regenerate"]
description = 'Build xcode project without applying swiftgen, swiftformat'
depends = ['project:rebuild']
run = ['open swiyu.xcodeproj']

[tasks."project:build"]
description = 'Build xcode project'
depends = ['quality:gen']
run = ['mise run quality:format', 'mise run project:xcodegen']

[tasks."project:rebuild"]
description = 'Re-Build xcode project without applying swiftgen, swiftformat'
depends = ['project:xcodegen']

[tasks."project:xcodegen"]
description = 'Build xcodeproj file'
run = 'xcodegen generate --use-cache --cache-path .xcodegen.cache'

# ── Quality ──────────────────────────────────────────────────────────

[tasks."quality:lint"]
description = 'Linting'
run = 'swiftlint --strict'

[tasks."quality:format"]
description = 'Format the project to expected code standards'
run = 'swiftformat . --cache .swiftformat.cache'

[tasks."quality:gen"]
description = 'Generate assets files'
sources = [
    'swiftgen.yml',
    'Modules/**/swiftgen*.yml',
    'Modules/**/*.stencil',
    'swiyu/Info.plist',
    'swiyu/Resources/Assets.xcassets/**/*',
    'Modules/**/Resources/**/*.xcassets/**/*',
    'Modules/**/Resources/Lottie/**/*',
    'Modules/**/Resources/*.lproj/**/*',
]
outputs = [
    'swiyu/Resources/Assets.swift',
    'swiyu/Resources/Plist.swift',
    'Modules/**/Module/*.swift',
    'Modules/Platforms/BITL10n/Sources/BITL10n/Strings.swift',
]
run = [
    'swiftgen',
    'swiftgen --config Modules/Platforms/BITCore/swiftgen.yml',
    'swiftgen --config Modules/Platforms/BITL10n/swiftgen.yml',
    'swiftgen --config Modules/Platforms/BITTheming/swiftgen.yml',
    'swiftgen --config Modules/Features/BITActivity/swiftgen.yml',
    'swiftgen --config Modules/Features/BITActivityDetail/swiftgen.yml',
    'swiftgen --config Modules/Features/BITAppAuth/swiftgen.yml',
    'swiftgen --config Modules/Features/BITCredential/swiftgen.yml',
    'swiftgen --config Modules/Features/BITEIDRequest/swiftgen.yml',
    'swiftgen --config Modules/Features/BITEIDRequest/swiftgen-otp.yml',
    'swiftgen --config Modules/Features/BITHome/swiftgen.yml',
    'swiftgen --config Modules/Features/BITInvitation/swiftgen.yml',
    'swiftgen --config Modules/Features/BITOnboarding/swiftgen.yml',
    'swiftgen --config Modules/Features/BITPresentation/swiftgen.yml',
    'swiftgen --config Modules/Features/BITSettings/swiftgen.yml',
]

[tasks."quality:pre-commit"]
description = 'pre-commit hook'
depends = ['quality:format', 'quality:lint', 'quality:remove-duplicate-text-keys']

[tasks."quality:remove-duplicate-text-keys"]
description = 'Removes duplicate text keys from localization files'
run = ['.resources/scripts/remove_duplicate_textkeys.rb']

# ── Test ─────────────────────────────────────────────────────────────

[tasks."test:run"]
description = 'Run app tests'
depends = ['project:build']
run = ['bundle exec fastlane scan --scheme "swiyu Ref"']

[tasks."test:danger"]
description = 'Danger swift'
run = ['swift build', 'swift run danger-swift ci']

# ── Deploy ───────────────────────────────────────────────────────────

[tasks."deploy:run"]
description = 'Deploy'
run = ['bundle install', 'bundle exec fastlane deploy env:{{option(name="environment", default="ref")}}']

[tasks."deploy:ref"]
description = 'Deploy REF (testflight)'
depends = ['setup:bundler']
run = 'mise run deploy:run --environment ref'

[tasks."deploy:abn"]
description = 'Deploy ABN (testflight)'
depends = ['setup:bundler']
run = 'mise run deploy:run --environment abn'

[tasks."deploy:debugger"]
description = 'Deploy Debugger (updraft)'
depends = ['setup:bundler']
run = 'mise run deploy:run --environment debugger'

[tasks."deploy:sandbox"]
description = 'Deploy Sandbox (testflight)'
depends = ['setup:bundler']
run = 'mise run deploy:run --environment sandbox'

[tasks."deploy:prod"]
description = 'Deploy PROD (testflight, appstoreconnect)'
depends = ['setup:bundler']
run = ['mise run deploy:run --environment prod', 'mise run deploy:run --environment sandbox', 'mise run deploy:run --environment abn']

# ── Profiles ─────────────────────────────────────────────────────────

[tasks."profiles:appstore-dev"]
run = 'bundle exec fastlane ios refresh_provisioning_profile_appstore env:dev'
[tasks."profiles:appstore-ref"]
run = 'bundle exec fastlane ios refresh_provisioning_profile_appstore env:ref'
[tasks."profiles:appstore-abn"]
run = 'bundle exec fastlane ios refresh_provisioning_profile_appstore env:abn'
[tasks."profiles:appstore-prod"]
run = 'bundle exec fastlane ios refresh_provisioning_profile_appstore env:prod'
[tasks."profiles:appstore-sandbox"]
run = 'bundle exec fastlane ios refresh_provisioning_profile_appstore env:sandbox'
[tasks."profiles:appstore-debugger"]
run = 'bundle exec fastlane ios refresh_provisioning_profile_appstore env:debugger'

[tasks."profiles:refresh-appstore"]
description = 'Refresh AppStore provisioning profiles (all envs)'
depends = ['setup:bundler']
run = [
    'mise run profiles:appstore-dev',
    'mise run profiles:appstore-ref',
    'mise run profiles:appstore-abn',
    'mise run profiles:appstore-prod',
    'mise run profiles:appstore-sandbox',
    'mise run profiles:appstore-debugger',
]

[tasks."profiles:development-dev"]
run = 'bundle exec fastlane ios refresh_provisioning_profile_development env:dev'
[tasks."profiles:development-ref"]
run = 'bundle exec fastlane ios refresh_provisioning_profile_development env:ref'
[tasks."profiles:development-abn"]
run = 'bundle exec fastlane ios refresh_provisioning_profile_development env:abn'
[tasks."profiles:development-prod"]
run = 'bundle exec fastlane ios refresh_provisioning_profile_development env:prod'
[tasks."profiles:development-sandbox"]
run = 'bundle exec fastlane ios refresh_provisioning_profile_development env:sandbox'
[tasks."profiles:development-debugger"]
run = 'bundle exec fastlane ios refresh_provisioning_profile_development env:debugger'

[tasks."profiles:refresh-development"]
description = 'Refresh development provisioning profiles (all envs)'
depends = ['setup:bundler']
run = [
    'mise run profiles:development-dev',
    'mise run profiles:development-ref',
    'mise run profiles:development-abn',
    'mise run profiles:development-prod',
    'mise run profiles:development-sandbox',
    'mise run profiles:development-debugger',
]

# ── CI ───────────────────────────────────────────────────────────────

[tasks."ci:sonar"]
description = 'Run sonar lane (dev)'
depends = ['setup:xcode-ci']
run = ['bundle install', 'bundle exec fastlane ios pipeline_sonar env:dev']

[tasks."ci:run"]
description = 'Run CI lane (dev)'
depends = ['setup:xcode-ci']
run = ['bundle install', 'bundle exec fastlane ios pipeline_ci env:dev']

[tasks."ci:run-ref"]
description = 'Run CI lane (dev)'
depends = ['setup:xcode-ci']
run = ['bundle install', 'bundle exec fastlane ios pipeline_ci env:ref']

[tasks."ci:build-ref"]
description = 'Run build lane (ref)'
depends = ['setup:xcode-ci']
run = ['bundle install', 'bundle exec fastlane ios pipeline_build env:ref']

[tasks."ci:build-debugger"]
description = 'Run build lane (debugger)'
depends = ['setup:xcode-ci']
run = ['bundle install', 'bundle exec fastlane ios pipeline_build env:debugger']

[tasks."ci:build-abn"]
description = 'Run appstore build (abn)'
depends = ['setup:xcode-ci']
run = ['bundle install', 'bundle exec fastlane ios pipeline_build env:abn']

[tasks."ci:build-sandbox"]
description = 'Run appstore build (sandbox)'
depends = ['setup:xcode-ci']
run = ['bundle install', 'bundle exec fastlane ios pipeline_build env:sandbox']

[tasks."ci:build-prod"]
description = 'Run appstore build (prod)'
depends = ['setup:xcode-ci']
run = ['bundle install', 'bundle exec fastlane ios pipeline_build env:prod']

[tasks."ci:tag"]
description = 'Run tag a version for a type defined as an env variable'
depends = ['setup:xcode-ci']
run = ['bundle install', 'bundle exec fastlane run tag_version version_bump_type:$APP_VERSION_BUMP_TYPE']

[tasks."ci:build-ref-sim"]
description = 'Run simulator build (ref)'
depends = ['setup:xcode-ci']
run = ['bundle install', 'bundle exec fastlane ios pipeline_build_simulator env:ref']

[tasks."ci:build-abn-sim"]
description = 'Run simulator build (abn)'
depends = ['setup:xcode-ci']
run = ['bundle install', 'bundle exec fastlane ios pipeline_build_simulator env:abn']

# ── Setup ────────────────────────────────────────────────────────────

[tasks."setup:xcode-ci"]
description = 'Xcode configuration for CI'
run = [
    'defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES',
    'defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES',
]

[tasks."setup:xcode"]
description = 'Add a series of configurations for xcode to align with necessary requirements'
run = [
    'defaults write com.apple.dt.Xcode DVTTextEditorTrimTrailingWhitespace -bool YES',
    'defaults write com.apple.dt.Xcode DVTTextEditorTrimWhitespaceOnlyLines -bool YES',
    'defaults write com.apple.dt.Xcode DVTTextIndentTabWidth -int 2',
    'defaults write com.apple.dt.Xcode DVTTextIndentWidth -int 2',
    'defaults write com.apple.dt.Xcode DVTTextPageGuideLocation -int 100',
]

[tasks."setup:git-hooks"]
description = 'Configure local git hooks for this repository'
run = [
    'chmod +x .githooks/post-checkout',
    'chmod +x .githooks/pre-commit',
    'chmod +x .resources/scripts/clean_swiftpm_dirs.sh',
    'chmod +x .resources/scripts/run_swift_quality_gate.sh',
    'git config --local core.hooksPath .githooks',
]

[tasks."setup:bundler"]
description = 'Install bundler dependencies'
run = 'bundle install'

[tasks.snyk-configuration]
description = 'Configure Snyk'
run = ['snyk config environment SNYK-EU-01 --no-check']